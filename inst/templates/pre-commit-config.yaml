# =====================================================================
# Shared pre-commit configuration for R analysts
# Managed by the 'precommitr' R package.
#
# To install in a new repo:
#   R> precommitr::use_precommits()
#
# To update the shared hook versions across the org, edit this file in
# the precommitr package and bump the package version.
# =====================================================================

repos:
  - repo: local
    hooks:
      - id: style-files
        name: Style R files with styler
        entry: Rscript -e 'styler::style_file(commandArgs(TRUE))'
        language: system
        files: '\.(R|Rmd|Rnw|Rprofile)$'

      - id: parsable-R
        name: Check R files parse
        entry: Rscript -e 'for (f in commandArgs(TRUE)) parse(f)'
        language: system
        files: '\.R$'

      - id: no-browser-statement
        name: Detect browser() calls
        entry: Rscript -e 'source(Sys.getenv("YOURORG_HOOKS_DIR") |> file.path("no-browser.R"))'
        language: system
        files: '\.R$'

      - id: trailing-whitespace
        name: Strip trailing whitespace
        entry: Rscript -e 'source(Sys.getenv("YOURORG_HOOKS_DIR") |> file.path("trailing-ws.R"))'
        language: system
        files: '.*'
