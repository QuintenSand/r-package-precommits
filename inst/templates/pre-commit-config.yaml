# =====================================================================
# Shared pre-commit configuration for R analysts
# Managed by the 'precommitr' R package.
#
# To install in a new repo:
#   R> precommitr::use_precommits()
#
# To update the shared hook versions across the org, edit this file in
# the precommitr package and bump the package version.
# =====================================================================

default_stages: [pre-commit]
default_language_version:
  python: python3

repos:
  # ---- R-specific hooks (styler, lintr, parsable-R, no-browser, ...) ----
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3.9009
    hooks:
      - id: style-files
        args: [--style_pkg=styler, --style_fun=tidyverse_style]
      - id: lintr
        args: [--warn_only]
      - id: parsable-R
      - id: no-browser-statement
      - id: no-debug-statement
      - id: no-print-statement
      - id: readme-rmd-rendered
      - id: use-tidy-description

  # ---- General hygiene hooks ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.Rd$'
      - id: end-of-file-fixer
        exclude: '\.Rd$'
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

ci:
  autoupdate_schedule: monthly
  skip: [lintr, style-files]
